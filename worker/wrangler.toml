name = "furnisher-proxy"
main = "index.js"
compatibility_date = "2024-01-01"

# FUNCTION_KEY is set as a secret, NOT here:
#   wrangler secret put FUNCTION_KEY

# Native Workers Rate Limiting (GA 2025-09). Burst protection per IP.
# period must be 10 or 60 seconds; this caps abusive loops.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "2001"

  [ratelimits.simple]
  limit = 5
  period = 60

# KV namespace for the per-IP daily cap (20/day) — persistent, global.
[[kv_namespaces]]
binding = "DAILY_LIMITS"
id = "539bd43f48d148069b7cacb70092afec"
